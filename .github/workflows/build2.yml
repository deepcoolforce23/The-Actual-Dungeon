name: Build APK

on: [push, workflow_dispatch]

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove -y libunwind-* || true
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev automake autopoint gettext aidl lib32stdc++6 libltdl-dev libgstreamer1.0-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel buildozer "cython<3.0"

      - name: Build APK
        run: |
          # Force Buildozer to use Python 3.11 and Kivy 2.3.1
          sed -i 's/requirements = python3,kivy/requirements = python3==3.11.9,kivy==2.3.1/' buildozer.spec
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAD-APK
          path: bin/*.apk
